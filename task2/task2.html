<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart - Products</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span>ShopKart</span>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for products...">
        </div>

    </nav>


    <div class="container">

        <div class="sidebar">

            <h3>Filters</h3>

            <div class="filter-section">
                <h4>Category</h4>

                <label>
                    <input type="checkbox"> Laptops
                </label>

                <label>
                    <input type="checkbox"> Desktops
                </label>

                <label>
                    <input type="checkbox"> Tablets
                </label>

                <label>
                    <input type="checkbox"> Accessories
                </label>
            </div>


            <div class="filter-section">
                <h4>Price Range</h4>

                <label>
                    <input type="checkbox"> ₹0 - ₹20,000
                </label>

                <label>
                    <input type="checkbox"> ₹20,000 - ₹50,000
                </label>

                <label>
                    <input type="checkbox"> ₹50,000 - ₹1,00,000
                </label>
            </div>


            <div class="filter-section">
                <h4>Brand</h4>

                <label>
                    <input type="checkbox"> Dell
                </label>

                <label>
                    <input type="checkbox"> Lenovo
                </label>

                <label>
                    <input type="checkbox"> Apple
                </label>
            </div>

            <button class="filter-btn">Apply Filters</button>

        </div>

        <div class="products-area">

            <div class="product-grid">

                <div class="product-card">

                    <div class="image-box">

                        <img src="https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=500"
                             alt="Lenovo IdeaPad">
                    </div>

                    <div class="category">Laptop</div>

                    <h2>Lenovo IdeaPad</h2>

                    <div class="price">
                        ₹38,990
                    </div>

                    <button>Add to Cart</button>

                </div>


                <div class="product-card">

                    <div class="image-box">

                        <img src="https://images.unsplash.com/photo-1593642532744-d377ab507dc8?w=500"
                             alt="ASUS Vivobook">
                    </div>

                    <div class="category">Laptop</div>

                    <h2>ASUS Vivobook</h2>

                    <div class="price">
                        ₹41,990
                    </div>

                    <button>Add to Cart</button>

                </div>

                <div class="product-card">

                    <div class="image-box">

                        <img src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500"
                             alt="HP Laptop">
                    </div>

                    <div class="category">Laptop</div>

                    <h2>HP Envy</h2>

                    <div class="price">
                        ₹59,990
                    </div>

                    <button>Add to Cart</button>

                </div>

                <div class="product-card">

                    <div class="image-box">

                        <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500"
                             alt="MacBook Pro">
                    </div>

                    <div class="category">Laptop</div>

                    <h2>MacBook Pro</h2>

                    <div class="price">
                        ₹1,29,000
                    </div>

                    <button>Add to Cart</button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
