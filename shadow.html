<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;

        }
        .box{
            display: flex;
            width: 800px;
            height: 300px;
            box-shadow: 0px 0px 20px rgba(204, 8, 178, 0.5);
            border-radius: 10px;
            font-size: 100px;
            font-weight: bolder;
            text-shadow: 2px 2px 20px rgba(213, 5, 5, 0.5);
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(red,blue);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">
            <p>Hello World</p>
        </div>   
     </div>
</body>
</html>
