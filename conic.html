<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            background-color: black;
        }
        .container{
            display:flex;
            height: 100vh;  
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
        }
        .box{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            background-image: conic-gradient(blue,purple,blue);
        }
        .inner{
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: conic-gradient(from 90deg, rgb(117, 180, 205),rgb(209, 152, 161), rgb(117, 180, 205));

        }
        .inner2{
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background-image: conic-gradient(from 45deg, skyblue, pink,skyblue);

        }
        .box1{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 300px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            background-image: conic-gradient(red,blue,yellow,blue);
        }
        .inner1{
            width: 90%;
            height: 90%;
            background-color: black;
        }
        #h1{
            color: white;
            text-align: center;
            font-size: 30px;
            font-weight: bolder;
            font-size: 30px;
            background-image: linear-gradient(to right, red, blue);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(213, 5, 5, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">
            <h1 id="h1">Squid Game</h1>
    </div>
        <div class="box">
            <div class="inner">
                <div class="inner2"></div>
            </div>
        </div>
        <div class="box1">
            <div class="inner1">
                <div class="inner3"></div   >
            </div>
        </div>
        
</body>
</html>
