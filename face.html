<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --main-color : #6096de;
            --secondary-color : plum;
            --font-size : 26px;
        }
        .container{
            outline: 1px dashed var(--secondary-color);
            height: 600px;
            width: 600px;
            justify-self:center;
            display: grid;
            background : linear-gradient(skyblue,white,skyblue);
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border-radius : 10px;
        }

        .container > div{
            outline : 1px dashed var(--secondary-color);
            font-size: var(--font-size);
            align-content : center;
        }

        .box1{
            grid-column : 6/11;
            grid-row : 1/2;
            background-color : var(--main-color);
        }

        .box2{
            grid-column : 4/6;
            grid-row : 2/3;
            background-color : var(--main-color);
        }

        .box3{
            grid-column : 11/13;
            grid-row : 2/3;
            background-color : var(--main-color);
        }

        .box4{
            grid-column : 3/4;
            grid-row : 3/4;
            background-color : var(--main-color);
        }

        .box5{
            grid-column : 13/14;
            grid-row : 3/4;
            background-color : var(--main-color);
        }

        .box6{
            grid-column : 2/3;
            grid-row : 4/6;
            background-color : var(--main-color);
        }

        .box7{
            grid-column : 14/15;
            grid-row : 4/6;
            background-color : var(--main-color);
        }

        .box8{
            grid-column : 1/16;
            grid-row : 6/7;
            background-color : var(--main-color);
        }

        .box9{
            grid-row: 7/11;
            grid-column: 1/2;
            background-color : var(--main-color);
        }

        .box10{
            grid-row: 7/11;
            grid-column: 15/16;
            background-color : var(--main-color);
        }

        .box11{
            grid-row: 7/9;
            grid-column: 3/5;
            background-color : var(--main-color);
        }

        .box12{
            grid-row: 8/9;
            grid-column: 5/6;
            background-color : var(--main-color);
        }

        .box13{
            grid-column: 4/7;
            grid-row: 9/10;
            background-color : var(--main-color);
        }

        .box14{
            grid-row: 7/9;
            grid-column: 9/11;
            background-color : var(--main-color);
        }

        .box15{
            grid-row: 8/9;
            grid-column: 11/12;
            background-color : var(--main-color);
        }

        .box16{
            grid-column: 10/13;
            grid-row: 9/10;
            background-color : var(--main-color);
        }

        .box17{
            grid-row: 7/9;
            grid-column: 7/8;
            background-color : var(--main-color);
        }

        .box18{
            grid-row: 7/8;
            grid-column: 8/9;
            background-color : var(--main-color);
        }

        .box19{
            grid-row: 7/9;
            grid-column: 13/14;
            background-color : var(--main-color);
        }

        .box20{
            grid-row: 11/13;
            grid-column: 2/3;
            background-color : var(--main-color);
        }

        .box21{
            grid-row: 11/13;
            grid-column: 14/15;
            background-color : var(--main-color);
        }

        .box22{
            grid-row: 13/14;
            grid-column: 3/4;
            background-color : var(--main-color);
        }

        .box23{
            grid-row: 13/14;
            grid-column: 13/14;
            background-color : var(--main-color);
        }

        .box24{
            grid-row: 14/15;
            grid-column: 4/6;
            background-color : var(--main-color);
        }

        .box25{
            grid-row: 14/15;
            grid-column: 11/13;
            background-color : var(--main-color);
        }

        .box26{
            grid-row: 15/16;
            grid-column: 6/11;
            background-color : var(--main-color);
        }



    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
        <div class="box8"></div>
        <div class="box9"></div>
        <div class="box10"></div>
        <div class="box11"></div>
        <div class="box12"></div>
        <div class="box13"></div>
        <div class="box14"></div>
        <div class="box15"></div>
        <div class="box16"></div>
        <div class="box17"></div>
        <div class="box18"></div>
        <div class="box19"></div>
        <div class="box20"></div>
        <div class="box21"></div>
        <div class="box22"></div>
        <div class="box23"></div>
        <div class="box24"></div>
        <div class="box25"></div>
        <div class="box26"></div>
        
    </div>
</body>
</html>
