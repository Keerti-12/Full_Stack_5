<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        }
        .container > div{
            min-height: 300px;
            box-shadow: 2px 2px 10px rgba(1, 19, 68, 0.5);
            margin: 10px;
            border-radius: 10px;
            background-color: #6096de;
            background : linear-gradient(white,skyblue,white)
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img1">
            1
        </div>
        <div class="img2">
            2
        </div>
        <div class="img3">
            3
        </div>
        <div class="img4">
            4
        </div>
        <div class="img5">
            5
        </div>
        <div class="img6">
            6
        </div>
        <div class="img7">
            7
        </div>
        <div class="img8">
            8
        </div>
        <div class="img9">
            9
        </div>
    </div>
</body>
</html>
