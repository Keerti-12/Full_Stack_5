<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-r from-blue-200 to-white-500 to-blue-200">
    <div class="w-[400px] h-[500px] m-auto flex items-center justify-center bg-gradient-to-r from-blue-300 to-white-800 to-blue-300 border-[2px] border-gray-300 rounded-md shadow-lg">
        <form>
            <div class = "mb-[20px] text-center text-[30px] justify-center items-center ">
                <h2 class="text-black font-bold">Login</h2>
            </div>
            <h1>Username</h1>
            <input class="border border-gray-300 rounded-md py-2 px-4 bg-white" type="text" placeholder="Username" required>
            <h1>Password</h1>
            <input class="border border-gray-300 rounded-md py-2 px-4 bg-white" type="password" placeholder="Password" required>
            <h1>Email</h1>
            <input class="border border-gray-300 rounded-md py-2 px-4 bg-white" type="email" placeholder="Email" required>
            <button type="submit" class="mt-[20px] p-[10px] bg-blue-500 text-white border-none rounded-md">Login</button>   
        </form>
    </div>
</body>
</html>
