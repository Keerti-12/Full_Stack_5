<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background:linear-gradient(rgb(48, 171, 212),white);
        }
        .login-container {
            display: flex;
            flex-direction: column;
            width: 400px;
            height: 500px;
            margin: 100px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            justify-content: center;
            background: linear-gradient(blue,white);
            box-shadow: 0 4px 8px rgba(0, 0.3, 0, 0.4);
        }
        .login-container form {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
    <form>
        <div class = "login" style="text-align: center; margin-bottom: 20px;">
            <h2>Login</h2>
            </div>
            <h1>Username</h1>
        <input type="text" placeholder="Username" required>
        <h1>Password</h1>
        <input type="password" placeholder="Password" required>
        <h1>Email</h1>
        <input type="email" placeholder="Email" required>
        <button type="submit" style="margin-top: 20px; padding: 10px; background-color: blue; color: white; border: none; border-radius: 5px;">Login</button>   
    </form>

    </div>
</body>
</html>
