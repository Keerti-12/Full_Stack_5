<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            /* grid-template-rows: repeat(auto-fit, minmax(200px, 1fr)); */
            grid-template-areas:
            "box1 box1 box2"
            "box1 box1 box3"
            "box4 box4 box5"
            "box6 box6 box7"
            "box8 box9 box7";
            gap :3%;
            /* box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); */
        }
        @media (max-width:500px){
            .container{
                grid-template-areas:
                "box1 box2 box3"
                "box4 box5 box6"
                "box7 box8 box9";
                
            }
        }
        @media (max-width:800px) and (min-width:501px){
            .container{
                grid-template-areas:
                "box1 box2 box3 box3"
                "box4 box4 box4 box6"
                "box7 box8 box8 box6"
                "box7 box9 box9 box9";
                
            }
        }

        .box {
            background-color: #4CAF50;
            min-height: 150px;
            /* height: 200px; */
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area:box1">1</div>
        <div class="box" style="grid-area:box2">2</div>
        <div class="box" style="grid-area:box3">3</div>
        <div class="box" style="grid-area:box4">4</div>
        <div class="box" style="grid-area:box5">5</div>
        <div class="box" style="grid-area:box6">6</div>
        <div class="box" style="grid-area:box7">7</div>
        <div class="box" style="grid-area:box8">8</div>
        <div class="box" style="grid-area:box9">9</div>

        </div>
    </div>
</body>
</html>
