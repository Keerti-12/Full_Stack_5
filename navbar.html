<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <style>
        .navbar {
            display: flex;
            background-color: #333;
            flex-direction: row;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgba(230, 12, 12, 0.4);
            flex :1;
            flex-direction: row;
        }
        .navbar .logo {
            color: white;
            margin-left: 20px;
            font-size: 30px;
            font-weight: bold;
            padding: 14px 20px;
        }
        .navbar .menu {
            display: flex;
            flex-direction: row;
            margin-left: auto;
            margin-right: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
            list-style-type: none;
            white-space: nowrap;
        }
    </style>
    <title>Basic Horizontal Navigation Bar</title>
</head>

<body>

    <div class="navbar">
        <div class="logo">BrandName</div>
        <div class="menu">
        <ul>
        <button>Home</button>
        <button>Services</button>
        <button>Contact</button>
        <button>About</button>
        <button>Login</button>
        </ul>
        </div>
    </div>
</body>

</html>
